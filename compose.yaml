
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: finanflow-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3000
    restart: unless-stopped

  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile.dev
    container_name: finanflow-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/api:/app
      - /app/node_modules
    env_file:
      - ./backend/api/.env
    environment:
      - NODE_ENV=development
    restart: unless-stopped